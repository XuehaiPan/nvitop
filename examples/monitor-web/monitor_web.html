<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nvitop web</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --card: #181b22;
        --border: #2a2f3a;
        --accent: #4ade80;
        --warn: #fbbf24;
        --danger: #f87171;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      h1 small {
        color: var(--muted);
        font-weight: 400;
        margin-left: 8px;
      }
      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      button {
        color: inherit;
        font: inherit;
      }
      .history-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 8px;
      }
      .chart-panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 16px;
        padding: 12px 16px 8px;
      }
      .chart-head {
        margin-bottom: 8px;
      }
      .chart-status {
        color: var(--muted);
        display: inline-block;
        font-size: 12px;
        margin-top: 3px;
      }
      .history-range {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      .history-range button {
        background: #0b0d12;
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        min-width: 42px;
        padding: 4px 9px;
      }
      .history-range button.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .host-chart {
        height: 260px;
        width: 100%;
      }
      .cards {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .card-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      .card-title .idx {
        color: var(--accent);
        margin-right: 6px;
      }
      .card-title .total {
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .row {
        display: grid;
        grid-template-columns: 80px 1fr 140px;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .row > label {
        color: var(--muted);
      }
      .row > .value {
        text-align: right;
      }
      .bar {
        position: relative;
        height: 10px;
        background: #0b0d12;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), #22d3ee);
        transition: width 200ms linear;
      }
      .bar-fill.warn {
        background: linear-gradient(90deg, var(--warn), #f97316);
      }
      .bar-fill.danger {
        background: linear-gradient(90deg, var(--danger), #be123c);
      }
      .status {
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 13px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .badge {
        background: #0b0d12;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
      }
      .thermal-value {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        white-space: nowrap;
      }
      .stale {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>nvitop web <small id="origin"></small></h1>
      <span class="badge" id="updated">Updated: —</span>
    </header>
    <div class="status">
      <span class="badge" id="host">Host: —</span>
      <span class="badge" id="buffer">Buffer: —</span>
      <span id="stale" class="stale" hidden></span>
    </div>
    <div class="history-toolbar">
      <div class="history-range" id="history-range">
        <button type="button" data-range="1m">1m</button>
        <button type="button" data-range="5m">5m</button>
        <button class="active" type="button" data-range="15m">15m</button>
        <button type="button" data-range="30m">30m</button>
        <button type="button" data-range="1h">1h</button>
        <button type="button" data-range="3h">3h</button>
        <button type="button" data-range="6h">6h</button>
        <button type="button" data-range="12h">12h</button>
        <button type="button" data-range="24h">24h</button>
      </div>
    </div>
    <section class="chart-panel">
      <div class="chart-head">
        <div>
          <h2>Host</h2>
          <span class="chart-status" id="chart-status">—</span>
        </div>
      </div>
      <div class="host-chart" id="host-chart"></div>
    </section>
    <div id="cards" class="cards"></div>
    <script>
      (() => {
        const KEY_PREFIX = "monitor/";
        const POLL_MS = 1000;
        const HISTORY_RANGES = {
          "1m": 60,
          "5m": 5 * 60,
          "15m": 15 * 60,
          "30m": 30 * 60,
          "1h": 60 * 60,
          "3h": 3 * 60 * 60,
          "6h": 6 * 60 * 60,
          "12h": 12 * 60 * 60,
          "24h": 24 * 60 * 60,
        };
        const DEFAULT_HISTORY_RANGE = "15m";
        let timer = null;
        let historyRange = DEFAULT_HISTORY_RANGE;
        let selectedHistoryRange = historyRange;
        let historyWindowSeconds = HISTORY_RANGES[historyRange];
        let chartSamples = [];
        let chartXRange = null;
        let chartRelayoutHandlerAttached = false;

        const $ = (id) => document.getElementById(id);
        const setText = (id, text) => {
          $(id).textContent = text;
        };

        const fmtPercent = (v) =>
          Number.isFinite(v) ? v.toFixed(0) + "%" : "—";
        const fmtPercentOne = (v) =>
          Number.isFinite(v) ? v.toFixed(1) + "%" : "—";
        const fmtC = (v) => (Number.isFinite(v) ? v.toFixed(0) + " °C" : "—");
        const fmtW = (v) => (Number.isFinite(v) ? v.toFixed(1) + " W" : "—");
        const fmtGibUsage = (value) => {
          if (!Number.isFinite(value)) return "—";
          if (Math.abs(value) >= 1024) return (value / 1024).toFixed(1) + "TiB";
          if (Math.abs(value) < 1) return (value * 1024).toFixed(0) + "MiB";
          return value.toFixed(1) + "GiB";
        };
        const fmtAge = (s) => {
          if (!Number.isFinite(s) || s < 0) return "—";
          if (s < 60) return s.toFixed(0) + "s";
          if (s < 3600) return (s / 60).toFixed(0) + "m";
          if (s < 86400) return (s / 3600).toFixed(1) + "h";
          return (s / 86400).toFixed(1) + "d";
        };

        const deviceScope = (info) => `gpu:${info.index}`;

        const pickMean = (metrics, scope, name) => {
          const prefix = `${KEY_PREFIX}${scope}/${name} (`;
          for (const key of Object.keys(metrics)) {
            if (key.startsWith(prefix) && key.endsWith("/mean"))
              return metrics[key];
          }
          return NaN;
        };
        const pickHumanMean = (metricsHuman, scope, name) => {
          const prefix = `${KEY_PREFIX}${scope}/${name} (`;
          for (const key of Object.keys(metricsHuman)) {
            if (key.startsWith(prefix) && key.endsWith("/mean"))
              return metricsHuman[key];
          }
          return "—";
        };
        const pickHostMean = (metrics, name) => {
          const prefix = `${KEY_PREFIX}host/${name} (`;
          for (const key of Object.keys(metrics)) {
            if (key.startsWith(prefix) && key.endsWith("/mean"))
              return metrics[key];
          }
          return NaN;
        };

        const barClass = (pct) =>
          pct >= 90
            ? "bar-fill danger"
            : pct >= 70
              ? "bar-fill warn"
              : "bar-fill";

        const historySeconds = () =>
          historyWindowSeconds || HISTORY_RANGES[DEFAULT_HISTORY_RANGE];

        const trimChartSamples = (nowEpoch = Date.now() / 1000) => {
          const minEpoch = nowEpoch - historySeconds();
          chartSamples = chartSamples.filter((sample) => sample.epoch >= minEpoch);
        };

        const chartSampleCount = () =>
          chartSamples.length === 1
            ? "1 sample"
            : `${chartSamples.length.toLocaleString()} samples`;

        const epochFromRangeValue = (value) => {
          if (value instanceof Date) return value.getTime() / 1000;
          if (typeof value === "number") {
            return value > 1e12 ? value / 1000 : value;
          }
          const parsed = Date.parse(value);
          if (Number.isFinite(parsed)) return parsed / 1000;
          const numeric = Number(value);
          if (Number.isFinite(numeric)) return numeric > 1e12 ? numeric / 1000 : numeric;
          return NaN;
        };

        const visibleChartSamples = () => {
          if (chartXRange === null) return chartSamples;
          const start = epochFromRangeValue(chartXRange[0]);
          const end = epochFromRangeValue(chartXRange[1]);
          if (!Number.isFinite(start) || !Number.isFinite(end)) return chartSamples;
          const minEpoch = Math.min(start, end);
          const maxEpoch = Math.max(start, end);
          return chartSamples.filter(
            (sample) => sample.epoch >= minEpoch && sample.epoch <= maxEpoch,
          );
        };

        const latestVisiblePercent = (name) => {
          const samples = visibleChartSamples();
          for (let i = samples.length - 1; i >= 0; i -= 1) {
            const value = pickHostMean(samples[i].metrics, name);
            if (Number.isFinite(value)) return value;
          }
          return NaN;
        };

        const latestVisibleHostMemoryUsage = () => {
          const samples = visibleChartSamples();
          for (let i = samples.length - 1; i >= 0; i -= 1) {
            const value = pickHostMean(samples[i].metrics, "memory_used");
            if (Number.isFinite(value)) return value;
          }
          return NaN;
        };

        const tracePercentName = (label, value) =>
          Number.isFinite(value) ? `${label} ${fmtPercentOne(value)}` : `${label} —`;
        const traceUsageName = (label, value) => `${label} ${fmtGibUsage(value)}`;

        const setActiveHistoryRange = (activeButton) => {
          const rangeEl = $("history-range");
          for (const child of rangeEl.querySelectorAll("button[data-range]")) {
            child.classList.toggle("active", child === activeButton);
          }
        };

        const historyButton = (range) =>
          $("history-range").querySelector(`[data-range="${range}"]`);

        const xRangeFromRelayout = (event) => {
          if (!event) return null;
          if (Array.isArray(event["xaxis.range"]) && event["xaxis.range"].length === 2) {
            return event["xaxis.range"];
          }
          if (
            event["xaxis.range[0]"] !== undefined &&
            event["xaxis.range[1]"] !== undefined
          ) {
            return [event["xaxis.range[0]"], event["xaxis.range[1]"]];
          }
          return null;
        };

        const handleChartRelayout = (event) => {
          const range = xRangeFromRelayout(event);
          if (range !== null) {
            historyRange = null;
            chartXRange = range;
            setActiveHistoryRange(null);
          } else if (event && event["xaxis.autorange"]) {
            historyRange = selectedHistoryRange || DEFAULT_HISTORY_RANGE;
            chartXRange = null;
            setActiveHistoryRange(historyButton(historyRange));
          }
        };

        const attachChartRelayoutHandler = () => {
          const chart = $("host-chart");
          if (chartRelayoutHandlerAttached || typeof chart.on !== "function") return;
          chart.on("plotly_relayout", handleChartRelayout);
          chartRelayoutHandlerAttached = true;
        };

        const renderHostChart = () => {
          if (!window.Plotly) {
            setText("chart-status", "Plotly unavailable");
            return;
          }

          trimChartSamples();
          const x = chartSamples.map((sample) => new Date(sample.epoch * 1000));
          const cpu = chartSamples.map((sample) => {
            const value = pickHostMean(sample.metrics, "cpu_percent");
            return Number.isFinite(value) ? value : null;
          });
          const memory = chartSamples.map((sample) => {
            const value = pickHostMean(sample.metrics, "memory_percent");
            return Number.isFinite(value) ? value : null;
          });
          const xaxis = {
            gridcolor: "#2a2f3a",
            linecolor: "#2a2f3a",
            tickformat: "%H:%M:%S",
            tickfont: { color: "#94a3b8" },
            zeroline: false,
          };
          if (chartXRange !== null) {
            xaxis.range = chartXRange;
          }

          const layout = {
            autosize: true,
            font: { color: "#e2e8f0", size: 12 },
            hovermode: "x unified",
            legend: {
              bgcolor: "rgba(0,0,0,0)",
              orientation: "h",
              x: 0,
              y: 1.15,
            },
            margin: { b: 34, l: 42, r: 16, t: 8 },
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "#0b0d12",
            uirevision: historyRange || "custom",
            xaxis,
            yaxis: {
              gridcolor: "#2a2f3a",
              linecolor: "#2a2f3a",
              range: [0, 100],
              ticksuffix: "%",
              tickfont: { color: "#94a3b8" },
              zeroline: false,
            },
          };
          const traces = [
            {
              line: { color: "#4ade80", width: 2 },
              mode: "lines",
              name: tracePercentName("CPU", latestVisiblePercent("cpu_percent")),
              type: "scatter",
              x,
              y: cpu,
            },
            {
              line: { color: "#38bdf8", width: 2 },
              mode: "lines",
              name: traceUsageName("Host Memory", latestVisibleHostMemoryUsage()),
              type: "scatter",
              x,
              y: memory,
            },
          ];
          const rendered = Plotly.react("host-chart", traces, layout, {
            displayModeBar: false,
            responsive: true,
          });
          if (rendered && typeof rendered.then === "function") {
            rendered.then(attachChartRelayoutHandler);
          } else {
            attachChartRelayoutHandler();
          }
          setText("chart-status", chartSampleCount());
        };

        const appendChartSample = (epoch, metrics) => {
          if (!Number.isFinite(epoch) || epoch <= 0) return;
          const sample = { epoch, metrics: metrics || {} };
          const last = chartSamples[chartSamples.length - 1];
          if (last && epoch <= last.epoch) {
            if (epoch === last.epoch) chartSamples[chartSamples.length - 1] = sample;
          } else {
            chartSamples.push(sample);
          }
          trimChartSamples(epoch);
          renderHostChart();
        };

        async function syncHistory() {
          const since = Math.max(0, Date.now() / 1000 - historySeconds());
          let payload;
          try {
            const resp = await fetch(
              "/history.json?since=" + encodeURIComponent(since.toFixed(3)),
              { cache: "no-store" },
            );
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            payload = await resp.json();
          } catch (err) {
            setText("chart-status", "history failed: " + err.message);
            return;
          }

          chartSamples = (payload.samples || [])
            .map((sample) => ({
              epoch: Number(sample.epoch),
              metrics: sample.metrics || {},
            }))
            .filter((sample) => Number.isFinite(sample.epoch) && sample.epoch > 0);
          trimChartSamples();
          renderHostChart();
        }

        const initHistoryRange = () => {
          const rangeEl = $("history-range");
          rangeEl.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-range]");
            if (!button) return;
            historyRange = button.dataset.range || DEFAULT_HISTORY_RANGE;
            selectedHistoryRange = historyRange;
            historyWindowSeconds =
              HISTORY_RANGES[historyRange] || HISTORY_RANGES[DEFAULT_HISTORY_RANGE];
            chartXRange = null;
            setActiveHistoryRange(button);
            syncHistory();
          });
        };

        const makeRow = (label, key, withBar) => {
          const row = document.createElement("div");
          row.className = "row";
          const lab = document.createElement("label");
          lab.textContent = label;
          row.appendChild(lab);
          if (withBar) {
            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("div");
            fill.className = "bar-fill";
            fill.dataset.bar = key;
            bar.appendChild(fill);
            row.appendChild(bar);
          } else {
            row.appendChild(document.createElement("span"));
          }
          const val = document.createElement("span");
          val.className = "value";
          val.dataset.val = key;
          val.textContent = "—";
          row.appendChild(val);
          return row;
        };

        const makeThermalRow = () => {
          const row = document.createElement("div");
          row.className = "row";
          const lab = document.createElement("label");
          lab.textContent = "Temp / Fan";
          row.appendChild(lab);
          row.appendChild(document.createElement("span"));
          const val = document.createElement("span");
          val.className = "value thermal-value";
          const temp = document.createElement("span");
          temp.dataset.val = "temp";
          temp.textContent = "—";
          const sep = document.createElement("span");
          sep.textContent = "·";
          const fan = document.createElement("span");
          fan.dataset.val = "fan";
          fan.textContent = "—";
          val.append(temp, sep, fan);
          row.appendChild(val);
          return row;
        };

        const buildCard = (info) => {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.scope = deviceScope(info);

          const title = document.createElement("div");
          title.className = "card-title";

          const titleLeft = document.createElement("span");
          const titleIdx = document.createElement("span");
          titleIdx.className = "idx";
          titleIdx.textContent = "#" + info.index;
          titleLeft.appendChild(titleIdx);
          titleLeft.appendChild(document.createTextNode(info.name));

          const titleRight = document.createElement("span");
          titleRight.className = "total";
          titleRight.textContent = info.memory_total_human || "—";

          title.appendChild(titleLeft);
          title.appendChild(titleRight);
          card.appendChild(title);

          card.appendChild(makeRow("GPU", "util", true));
          card.appendChild(makeRow("GMBW", "membw", true));
          card.appendChild(makeRow("GMEM", "mem", true));
          card.appendChild(makeThermalRow());
          card.appendChild(makeRow("Power", "power", true));
          return card;
        };

        const updateCard = (card, info, metrics, metricsHuman) => {
          const scope = deviceScope(info);
          const util = pickMean(metrics, scope, "gpu_utilization");
          const memBw = pickMean(metrics, scope, "memory_utilization");
          const memUsedHuman = pickHumanMean(
            metricsHuman,
            scope,
            "memory_used",
          );
          const memPct = pickMean(metrics, scope, "memory_percent");
          const temp = pickMean(metrics, scope, "temperature");
          const fan = pickMean(metrics, scope, "fan_speed");
          const power = pickMean(metrics, scope, "power_usage");
          const powerLimit = pickMean(metrics, scope, "power_limit");
          const powerPct =
            Number.isFinite(power) &&
            Number.isFinite(powerLimit) &&
            powerLimit > 0
              ? (power / powerLimit) * 100
              : NaN;

          const setBar = (name, pct) => {
            const bar = card.querySelector(`[data-bar="${name}"]`);
            if (!bar) return;
            const clamped = Number.isFinite(pct)
              ? Math.max(0, Math.min(100, pct))
              : 0;
            bar.style.width = clamped + "%";
            bar.className = barClass(pct);
          };
          setBar("util", util);
          setBar("membw", memBw);
          setBar("mem", memPct);
          setBar("power", powerPct);

          card.querySelector('[data-val="util"]').textContent =
            fmtPercent(util);
          card.querySelector('[data-val="membw"]').textContent =
            fmtPercent(memBw);
          card.querySelector('[data-val="mem"]').textContent =
            `${memUsedHuman} (${fmtPercentOne(memPct)})`;
          const tempEl = card.querySelector('[data-val="temp"]');
          tempEl.textContent = fmtC(temp);
          // Temperature is degrees Celsius, not a fraction — no bar, but keep the
          // warn/danger color cue on the numeric value (>=70 warn, >=90 danger).
          tempEl.style.color = !Number.isFinite(temp)
            ? ""
            : temp >= 90
              ? "var(--danger)"
              : temp >= 70
                ? "var(--warn)"
                : "";
          card.querySelector('[data-val="fan"]').textContent = fmtPercent(fan);
          card.querySelector('[data-val="power"]').textContent = fmtW(power);
        };

        async function tick() {
          let payload;
          try {
            const resp = await fetch("/metrics.json", { cache: "no-store" });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            payload = await resp.json();
          } catch (err) {
            $("stale").hidden = false;
            $("stale").textContent = "fetch failed: " + err.message;
            return;
          }

          setText("origin", location.origin);

          const cardsEl = $("cards");
          const devices = payload.devices || [];
          if (cardsEl.children.length !== devices.length) {
            cardsEl.replaceChildren(...devices.map(buildCard));
          }
          devices.forEach((info, i) =>
            updateCard(
              cardsEl.children[i],
              info,
              payload.metrics || {},
              payload.metrics_human || {},
            ),
          );

          const m = payload.metrics || {};
          const hostMemoryUsed = pickHumanMean(
            payload.metrics_human || {},
            "host",
            "memory_used",
          );
          setText(
            "host",
            `Host: CPU ${fmtPercent(pickHostMean(m, "cpu_percent"))}` +
              ` · Memory ${hostMemoryUsed} (${fmtPercent(pickHostMean(m, "memory_percent"))})` +
              ` · Swap ${fmtPercent(pickHostMean(m, "swap_percent"))}`,
          );

          const b = payload.buffer || {};
          const age =
            b.oldest_epoch && b.count > 0
              ? payload.server_time - b.oldest_epoch
              : 0;
          setText(
            "buffer",
            `Buffer: ${b.count}/${b.max_count} samples` +
              ` · retention ${b.retention_human}` +
              ` · oldest ${fmtAge(age)} ago`,
          );

          const stale = payload.stale_seconds || 0;
          const staleEl = $("stale");
          if (stale > 2 * (payload.interval || 1.0)) {
            staleEl.hidden = false;
            staleEl.textContent = "stale " + fmtAge(stale);
          } else {
            staleEl.hidden = true;
          }

          appendChartSample(payload.sample_time || payload.server_time || 0, m);

          const t = payload.server_time || 0;
          setText(
            "updated",
            "Updated: " + (t ? new Date(t * 1000).toLocaleTimeString() : "—"),
          );
        }

        initHistoryRange();
        syncHistory();
        tick();
        timer = setInterval(tick, POLL_MS);
        window.addEventListener("pagehide", () => {
          if (timer !== null) clearInterval(timer);
        });
      })();
    </script>
  </body>
</html>
